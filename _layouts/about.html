---
layout: default
---
<header class="about-header">
  <img class="about-portrait" src="{{ '/assets/images/thmercer-avatar.webp' | relative_url }}"
       alt="T. H. Mercer" width="104" height="104" decoding="async">
  <div class="about-header-text">
    <h1 class="about-name">{{ site.title }}</h1>
    {% if page.tagline %}<p class="about-tagline">{{ page.tagline }}</p>{% endif %}
  </div>
</header>
<div class="about-body">
  {{ content }}
</div>
